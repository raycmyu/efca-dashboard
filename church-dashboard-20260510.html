<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EFCA Weekly Dashboard — 10 May 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&family=Space+Mono&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0D0F14; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #13161E; }
    ::-webkit-scrollbar-thumb { background: #2E3448; border-radius: 99px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const gold      = "#C9A84C";
    const goldLight = "#E8C97A";
    const goldDim   = "#7A6128";
    const bg        = "#0D0F14";
    const card      = "#13161E";
    const cardBorder= "#1E2330";
    const textPrimary = "#F0EDE6";
    const textMuted   = "#7A8099";
    const textDim     = "#4A5168";
    const green     = "#4CAF82";

    const data = {
      date: "10 May 2026",
      bulletinDate: "17 May 2026",
      attendance: [
        { label: "Cantonese 8:45am",  zh: "粵語 早堂",   count: 227, color: gold },
        { label: "Cantonese 10:30am", zh: "粵語 中堂",   count: 243, color: goldLight },
        { label: "Cantonese 12:15pm", zh: "粵語 午堂",   count: 72,  color: goldDim },
        { label: "English Ministry",  zh: "英語事工",    count: 132, color: "#6B9ED4" },
        { label: "Youth Ministry",    zh: "青少年事工",  count: 57,  color: "#9B7BD4" },
        { label: "Mandarin Ministry", zh: "國語事工",    count: 76,  color: "#6BD4B0" },
      ],
      children: [
        { label: "8:45am",  count: 38 },
        { label: "10:30am", count: 13 },
        { label: "12:15pm", count: 15 },
      ],
      cashCollections: [
        { fund: "General Fund",         zh: "經常費",       s845: 1912.30, s1030: 2201.95, s1215: 779.95,  eng: 1422.20 },
        { fund: "Mission Fund",         zh: "差傳基金",     s845: 50,      s1030: 50,      s1215: 50,      eng: null },
        { fund: "Building Fund",        zh: "建堂基金",     s845: 100,     s1030: 250,     s1215: null,    eng: null },
        { fund: "Children's Offertory", zh: "兒童崇拜奉獻", s845: null,    s1030: 16,      s1215: null,    eng: null },
        { fund: "Designated Gift",      zh: "指定奉獻",     s845: null,    s1030: 100,     s1215: null,    eng: null },
        { fund: "Book Sales",           zh: "書本收入",     s845: null,    s1030: 20,      s1215: null,    eng: null },
      ],
      etransfer: [
        { fund: "General Fund",          zh: "經常費",         cant: 29404.05, eng: 3068.79, mand: 280.00 },
        { fund: "Mission Fund",          zh: "差傳基金",       cant: 960.00,   eng: 351.67,  mand: null },
        { fund: "Building Fund",         zh: "建堂基金",       cant: 400.00,   eng: 40.00,   mand: null },
        { fund: "Seminary Student Fund", zh: "神學生助學基金",  cant: 10.00,    eng: null,    mand: null },
        { fund: "Welfare Fund",          zh: "慈惠基金",       cant: 10.00,    eng: null,    mand: null },
      ],
      ytd: {
        generalFund: { target: 1713913, weeklyTarget: 32960, cumTarget: 1483194, actual: 1745272 },
        missionFund: { target: 157000,  weeklyTarget: null,  cumTarget: 135865,  actual: 233455  },
      },
    };

    const fmt = (n) =>
      n == null
        ? "—"
        : "$" + n.toLocaleString("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const fmtK = (n) =>
      n >= 1000000
        ? "$" + (n / 1000000).toFixed(2) + "M"
        : "$" + (n / 1000).toFixed(1) + "K";

    const totalAttendance = data.attendance.reduce((s, r) => s + r.count, 0);
    const totalChildren   = data.children.reduce((s, r) => s + r.count, 0);

    function ProgressBar({ value, max, color = gold, thin = false }) {
      const pct = Math.min(100, (value / max) * 100);
      return (
        <div style={{ background: "#1A1E2A", borderRadius: 99, overflow: "hidden", height: thin ? 4 : 8 }}>
          <div style={{ width: `${pct}%`, height: "100%", background: color, borderRadius: 99, boxShadow: `0 0 8px ${color}66` }} />
        </div>
      );
    }

    function Card({ children, style = {} }) {
      return (
        <div style={{ background: card, border: `1px solid ${cardBorder}`, borderRadius: 16, padding: "20px 22px", ...style }}>
          {children}
        </div>
      );
    }

    function SectionLabel({ children }) {
      return (
        <div style={{ fontSize: 11, fontFamily: "'Space Mono', monospace", color: gold, letterSpacing: "0.15em", textTransform: "uppercase", marginBottom: 14 }}>
          {children}
        </div>
      );
    }

    function StatBig({ label, zh, value, sub }) {
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <div style={{ fontSize: 36, fontFamily: "'Playfair Display', serif", color: textPrimary, lineHeight: 1 }}>{value}</div>
          {sub && <div style={{ fontSize: 12, color: textMuted }}>{sub}</div>}
          <div style={{ fontSize: 13, color: textPrimary, marginTop: 2 }}>{label}</div>
          <div style={{ fontSize: 11, color: textDim }}>{zh}</div>
        </div>
      );
    }

    function Dashboard() {
      const [tab, setTab] = useState("cash");
      const gf = data.ytd.generalFund;
      const mf = data.ytd.missionFund;
      const gfOver = gf.actual - gf.cumTarget;
      const mfOver = mf.actual - mf.cumTarget;

      return (
        <div style={{ minHeight: "100vh", background: bg, color: textPrimary, fontFamily: "'DM Sans', sans-serif", padding: "32px 24px" }}>

          {/* Header */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 28, flexWrap: "wrap", gap: 12 }}>
            <div>
              <div style={{ fontSize: 11, fontFamily: "'Space Mono', monospace", color: gold, letterSpacing: "0.15em", marginBottom: 6 }}>
                EVANGELICAL FREE CHURCH OF AUSTRALIA · 澳洲基督教播道會靈福堂
              </div>
              <div style={{ fontSize: 26, fontFamily: "'Playfair Display', serif", color: textPrimary, lineHeight: 1.2 }}>
                Weekly Bulletin Dashboard
              </div>
              <div style={{ fontSize: 13, color: textMuted, marginTop: 4 }}>
                Statistics for <span style={{ color: gold }}>{data.date}</span> · Bulletin dated {data.bulletinDate}
              </div>
            </div>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              <div style={{ width: 8, height: 8, borderRadius: "50%", background: green, boxShadow: `0 0 8px ${green}` }} />
              <span style={{ fontSize: 12, color: green }}>YTD on track</span>
            </div>
          </div>

          {/* KPI Cards */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))", gap: 14, marginBottom: 20 }}>
            <Card style={{ borderColor: gold + "44", background: `linear-gradient(135deg, #1A1608 0%, ${card} 60%)` }}>
              <SectionLabel>Total Attendance · 總出席</SectionLabel>
              <StatBig label="All Services" zh="所有崇拜" value={totalAttendance.toLocaleString()} />
            </Card>
            <Card>
              <SectionLabel>Cantonese Total · 粵語合計</SectionLabel>
              <StatBig label="3 Sessions" zh="三堂" value={(227 + 243 + 72).toLocaleString()} />
            </Card>
            <Card>
              <SectionLabel>Children · 兒童</SectionLabel>
              <StatBig label="Worship & Sunday School" zh="兒童崇拜/主日學" value={totalChildren} />
            </Card>
            <Card style={{ borderColor: green + "44" }}>
              <SectionLabel>YTD General Fund · 累積經常費</SectionLabel>
              <StatBig label="Received vs Target" zh="實收 vs 目標" value={fmtK(gf.actual)} sub={`Target: ${fmtK(gf.cumTarget)}`} />
            </Card>
            <Card style={{ borderColor: green + "44" }}>
              <SectionLabel>YTD Mission Fund · 累積差傳基金</SectionLabel>
              <StatBig label="Received vs Target" zh="實收 vs 目標" value={fmtK(mf.actual)} sub={`Target: ${fmtK(mf.cumTarget)}`} />
            </Card>
          </div>

          {/* Attendance */}
          <Card style={{ marginBottom: 20 }}>
            <SectionLabel>Attendance by Service · 各崇拜出席人數</SectionLabel>
            <div style={{ display: "flex", flexDirection: "column", gap: 13 }}>
              {data.attendance.map((s) => (
                <div key={s.label}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                    <div>
                      <span style={{ fontSize: 13, color: textPrimary }}>{s.label}</span>
                      <span style={{ fontSize: 11, color: textDim, marginLeft: 8 }}>{s.zh}</span>
                    </div>
                    <span style={{ fontSize: 14, fontFamily: "'Space Mono', monospace", color: s.color }}>{s.count}</span>
                  </div>
                  <ProgressBar value={s.count} max={300} color={s.color} />
                </div>
              ))}
            </div>
            <div style={{ marginTop: 20, paddingTop: 16, borderTop: `1px solid ${cardBorder}` }}>
              <div style={{ fontSize: 12, color: textMuted, marginBottom: 10 }}>Children's Worship / Sunday School · 兒童崇拜/主日學</div>
              <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                {data.children.map((c) => (
                  <div key={c.label} style={{ flex: "1 1 80px", background: "#1A1E2A", borderRadius: 10, padding: "10px 14px", textAlign: "center" }}>
                    <div style={{ fontSize: 22, fontFamily: "'Playfair Display', serif", color: textPrimary }}>{c.count}</div>
                    <div style={{ fontSize: 11, color: textMuted, marginTop: 2 }}>{c.label}</div>
                  </div>
                ))}
                <div style={{ flex: "1 1 80px", background: "#1A1E2A", borderRadius: 10, padding: "10px 14px", textAlign: "center" }}>
                  <div style={{ fontSize: 22, fontFamily: "'Playfair Display', serif", color: gold }}>{totalChildren}</div>
                  <div style={{ fontSize: 11, color: textMuted, marginTop: 2 }}>Total · 合計</div>
                </div>
              </div>
            </div>
          </Card>

          {/* Offertory */}
          <Card style={{ marginBottom: 20 }}>
            <SectionLabel>Offertory · 奉獻</SectionLabel>
            <div style={{ display: "flex", gap: 4, marginBottom: 18, background: "#0D0F14", borderRadius: 10, padding: 4, width: "fit-content" }}>
              {[{ key: "cash", label: "Cash · 現金" }, { key: "etransfer", label: "E-Transfer · 電子轉賬" }].map((t) => (
                <button key={t.key} onClick={() => setTab(t.key)} style={{
                  background: tab === t.key ? gold : "transparent",
                  color: tab === t.key ? "#0D0F14" : textMuted,
                  border: "none", borderRadius: 7, padding: "6px 14px",
                  fontSize: 12, fontFamily: "'DM Sans', sans-serif", fontWeight: 500, cursor: "pointer",
                }}>{t.label}</button>
              ))}
            </div>

            {tab === "cash" && (
              <div style={{ overflowX: "auto" }}>
                <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                  <thead>
                    <tr>
                      {["Fund · 基金", "8:45am", "10:30am", "12:15pm", "English · 英語", "Row Total"].map((h) => (
                        <th key={h} style={{ textAlign: h === "Fund · 基金" ? "left" : "right", padding: "6px 10px", color: textDim, fontWeight: 400, fontSize: 11, fontFamily: "'Space Mono', monospace", borderBottom: `1px solid ${cardBorder}`, whiteSpace: "nowrap" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {data.cashCollections.map((r, i) => {
                      const vals = [r.s845, r.s1030, r.s1215, r.eng];
                      const rowTotal = vals.reduce((s, v) => s + (v || 0), 0);
                      return (
                        <tr key={i} style={{ borderBottom: `1px solid ${cardBorder}22` }}>
                          <td style={{ padding: "9px 10px" }}>
                            <div style={{ color: textPrimary }}>{r.fund}</div>
                            <div style={{ fontSize: 11, color: textDim }}>{r.zh}</div>
                          </td>
                          {vals.map((v, j) => (
                            <td key={j} style={{ padding: "9px 10px", textAlign: "right", color: v ? textPrimary : textDim, fontFamily: "'Space Mono', monospace", fontSize: 12 }}>{fmt(v)}</td>
                          ))}
                          <td style={{ padding: "9px 10px", textAlign: "right", color: gold, fontFamily: "'Space Mono', monospace", fontSize: 12, fontWeight: 600 }}>{rowTotal > 0 ? fmt(rowTotal) : "—"}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}

            {tab === "etransfer" && (
              <div>
                <div style={{ fontSize: 11, color: textDim, marginBottom: 12 }}>Period: 4/5/2026 – 10/5/2026 · Westpac BSB 032-091 Acc 351813</div>
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>
                    <thead>
                      <tr>
                        {["Fund · 基金", "Cantonese · 粵語", "English · 英語", "Mandarin · 國語", "Row Total"].map((h) => (
                          <th key={h} style={{ textAlign: h === "Fund · 基金" ? "left" : "right", padding: "6px 10px", color: textDim, fontWeight: 400, fontSize: 11, fontFamily: "'Space Mono', monospace", borderBottom: `1px solid ${cardBorder}`, whiteSpace: "nowrap" }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {data.etransfer.map((r, i) => {
                        const vals = [r.cant, r.eng, r.mand];
                        const rowTotal = vals.reduce((s, v) => s + (v || 0), 0);
                        return (
                          <tr key={i} style={{ borderBottom: `1px solid ${cardBorder}22` }}>
                            <td style={{ padding: "9px 10px" }}>
                              <div style={{ color: textPrimary }}>{r.fund}</div>
                              <div style={{ fontSize: 11, color: textDim }}>{r.zh}</div>
                            </td>
                            {vals.map((v, j) => (
                              <td key={j} style={{ padding: "9px 10px", textAlign: "right", color: v ? textPrimary : textDim, fontFamily: "'Space Mono', monospace", fontSize: 12 }}>{fmt(v)}</td>
                            ))}
                            <td style={{ padding: "9px 10px", textAlign: "right", color: gold, fontFamily: "'Space Mono', monospace", fontSize: 12, fontWeight: 600 }}>{fmt(rowTotal)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </Card>

          {/* YTD */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 14, marginBottom: 20 }}>
            {[
              { label: "General Fund", zh: "經常費",   target: gf.target, weeklyTarget: gf.weeklyTarget, cumTarget: gf.cumTarget, actual: gf.actual, over: gfOver },
              { label: "Mission Fund", zh: "差傳基金", target: mf.target, weeklyTarget: mf.weeklyTarget, cumTarget: mf.cumTarget, actual: mf.actual, over: mfOver },
            ].map((f) => (
              <Card key={f.label} style={{ borderColor: green + "33" }}>
                <SectionLabel>YTD · {f.label} · {f.zh}</SectionLabel>
                <div style={{ display: "flex", gap: 16, marginBottom: 16, flexWrap: "wrap" }}>
                  <div>
                    <div style={{ fontSize: 11, color: textDim, marginBottom: 3 }}>Annual Target · 年度目標</div>
                    <div style={{ fontSize: 18, fontFamily: "'Playfair Display', serif", color: textPrimary }}>{fmtK(f.target)}</div>
                  </div>
                  {f.weeklyTarget && (
                    <div>
                      <div style={{ fontSize: 11, color: textDim, marginBottom: 3 }}>Weekly Target · 每週目標</div>
                      <div style={{ fontSize: 18, fontFamily: "'Playfair Display', serif", color: textPrimary }}>{fmtK(f.weeklyTarget)}</div>
                    </div>
                  )}
                </div>
                <div style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                    <span style={{ fontSize: 12, color: textMuted }}>Cumulative Target · 累積目標</span>
                    <span style={{ fontSize: 12, fontFamily: "'Space Mono', monospace", color: textMuted }}>{fmtK(f.cumTarget)}</span>
                  </div>
                  <ProgressBar value={f.cumTarget} max={f.target} color={cardBorder} thin={true} />
                </div>
                <div style={{ marginBottom: 10 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5 }}>
                    <span style={{ fontSize: 12, color: textPrimary }}>Actual Received · 實收</span>
                    <span style={{ fontSize: 12, fontFamily: "'Space Mono', monospace", color: green }}>{fmtK(f.actual)}</span>
                  </div>
                  <ProgressBar value={f.actual} max={f.target} color={green} />
                </div>
                <div style={{ marginTop: 14, padding: "10px 14px", background: green + "15", border: `1px solid ${green}33`, borderRadius: 10, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 12, color: green }}>Ahead of Target · 超過目標</span>
                  <span style={{ fontFamily: "'Space Mono', monospace", fontSize: 14, color: green }}>+{fmtK(f.over)}</span>
                </div>
              </Card>
            ))}
          </div>

          {/* Footer */}
          <div style={{ textAlign: "center", fontSize: 11, color: textDim, fontFamily: "'Space Mono', monospace", paddingTop: 8 }}>
            EFCA · 澳洲基督教播道會靈福堂 · 518 Pacific Highway, Lane Cove North NSW 2066 · office@efca.org.au
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(Dashboard));
  </script>
</body>
</html>
